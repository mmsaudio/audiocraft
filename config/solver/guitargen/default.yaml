# @package __global__

defaults:
  - /solver/default
  - /conditioner: none
  - _self_
  - override /dset: audio/guitar_dataset

autocast: true
autocast_dtype: float16

solver: guitargen
sample_rate: 44100
channels: 1
compression_model_checkpoint: /home/vuillemr/audiocraft/exp/xps/6c42ffdf/

lm_model: transformer_lm

codebooks_pattern:
  modeling: parallel
  # modeling: delay
  # delay:
  #   delays: [0, 1, 2, 3, 4, 5, 6, 7]
  #   flatten_first: 0
  #   empty_initial: 0
  # unroll:
  #   flattening: [0, 1, 2, 3, 4, 5, 6, 7]
  #   delays: [0, 0, 0, 0, 0, 0, 0, 0]
  # music_lm:
  #   group_by: 2
  # coarse_first:
  #   delays: [0, 0, 0]


transformer_lm:
  n_q: 8
  card: 1024
  dim: 256         
  num_heads: 8
  hidden_scale: 4
  num_layers: 8
  norm: layer_norm
  norm_first: true
  causal: true
  cross_attention: false
  positional_embedding: sin
  max_period: 10_000
  bias_ff: false
  bias_attn: false
  bias_proj: False
  layer_scale: None
  weight_init: gaussian
  depthwise_init: current
  zero_bias_init: True
  attention_as_float32: False
  memory_efficient: True


tokens:
  padding_with_special_token: false
deadlock:
  use: true  # deadlock detection

interleave_stereo_codebooks:
  use: false
  per_timestep: false

cache:
  path:
  write: false
  write_shard: 0
  write_num_shards: 1


dataset:
  batch_size: 128
  num_workers: 10
  segment_duration: 30
  min_segment_ratio: 0.8  # lower values such as 0.5 result in generations with a lot of silence.
  return_info: true
  sample_on_weight: false  # Uniform sampling all the way
  sample_on_duration: false  # Uniform sampling all the way
  train:
    num_samples: 1000000 # need a randomly large number here for AudioDataset
  valid:
    num_samples: 10000
  generate:
    num_samples: 50

metrics:
  fad:
    use_gt: false
    model: tf
    tf:
      bin: null  # path to local frechet_audio_distance code
      model_path: //reference/fad/vggish_model.ckpt
  kld:
    use_gt: false
    model: passt
    passt:
      pretrained_length: 20
  text_consistency:
    use_gt: false
    model: clap
    clap:
      model_path: //reference/clap/music_audioset_epoch_15_esc_90.14.pt
      model_arch: 'HTSAT-base'
      enable_fusion: false
  chroma_cosine:
    use_gt: false
    model: chroma_base
    chroma_base:
      sample_rate: ${sample_rate}
      n_chroma: 12
      radix2_exp: 14
      argmax: true

generate:
  every: 25
  num_workers: 5
  path: samples
  audio:
    format: wav
    strategy: loudness
    sample_rate: ${sample_rate}
    loudness_headroom_db: 14
  lm:
    prompted_samples: true
    unprompted_samples: true
    no_text_conditioning: false
    gen_gt_samples: false
    prompt_duration: null   # if not set, will use dataset.generate.segment_duration / 4
    gen_duration: null      # if not set, will use dataset.generate.segment_duration
    remove_prompts: false
    # generation params
    use_sampling: false
    temp: 1.0
    top_k: 0
    top_p: 0.0

evaluate:
  every: 25
  num_workers: 5
  metrics:
    base: false
    fad: false
    kld: false
    text_consistency: false
    chroma_cosine: false

checkpoint:
  save_last: true
  save_every: 50
  keep_last: 10
  keep_every_states: null


optim:
  epochs: 200
  updates_per_epoch: 2000
  lr: 1
  optimizer: dadam
  max_norm: 1.0
  eager_sync: true
  adam:
    betas: [0.9, 0.95]
    weight_decay: 0.1
    eps: 1e-8

schedule:
  lr_scheduler: cosine
  cosine:
    warmup: 4000
    lr_min_ratio: 0.0
    cycle_length: 1.0
